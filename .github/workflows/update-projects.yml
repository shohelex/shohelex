name: Update projects

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [projects.json]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Update the cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_projects.py

      - name: Save any change
        run: |
          git add README.md assets/projects
          if git diff --cached --quiet; then
            echo "Nothing to save."
            exit 0
          fi
          git config user.name shohelex
          git config user.email 66155135+shohelex@users.noreply.github.com
          git commit -m "Update projects"
          git pull --rebase origin main
          git push
