<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile design source</title>
<!--
  Template for the images in ../identity. scripts/update_identity.py fills in profile.json below,
  then renders each section at 2x with a transparent page background. A URL hash such as
  design.html#hero shows one section; with no hash, every section shows so all fonts load.
  Project and paper cards are not here: scripts/update_projects.py and update_papers.py write them.
-->
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  :root {
    --panel: #ffffff;
    --line: #e3e8f0;
    --text: #0f1521;
    --muted: #283344;
    --faint: #4f5b70;
    --amber: #a8620f;
    --coral: #c2442b;
    --teal: #0a7569;
    --lilac: #5546c0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; }
  body { font-family: Inter, sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }
  section { display: none; }
  section.shown { display: block; }

  /* Hero */
  .hero {
    position: relative; width: 880px; height: 176px; overflow: hidden; border-radius: 15px;
    background:
      radial-gradient(52% 130% at 94% 0%, rgba(255, 171, 140, .42), transparent 62%),
      radial-gradient(44% 125% at 70% 120%, rgba(120, 222, 206, .36), transparent 62%),
      radial-gradient(38% 120% at 102% 104%, rgba(176, 164, 245, .34), transparent 64%),
      linear-gradient(120deg, #ffffff, #fbfcfe);
    box-shadow: inset 0 0 0 1px var(--line);
  }
  .grid {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(40, 55, 85, .17) 1px, transparent 1.3px);
    background-size: 18px 18px;
    -webkit-mask-image: linear-gradient(100deg, transparent 58%, #000 92%);
  }
  #orbits {
    position: absolute; inset: 0; width: 880px; height: 176px;
    -webkit-mask-image: linear-gradient(90deg, transparent 57%, #000 76%);
  }
  .copy { position: absolute; left: 32px; top: 50%; transform: translateY(-50%); }
  .hello { font: 500 12px/1 "JetBrains Mono", monospace; color: var(--amber); word-spacing: -.22em; }
  h1 { margin-top: 7px; font: 400 52px/1 "Instrument Serif", serif; letter-spacing: -.012em; color: var(--text); }
  .role { margin-top: 10px; font-size: 14.5px; font-weight: 500; line-height: 1.3; color: #1f2937; }
  .role + .role { margin-top: 3px; }

  /* Shared strip */
  .strip {
    display: flex; align-items: center; width: 420px; overflow: hidden; border-radius: 14px;
    background:
      radial-gradient(60% 150% at 100% 50%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 70%),
      var(--panel);
    box-shadow: inset 0 0 0 1px var(--line);
  }
  .mark {
    display: grid; place-items: center; flex: none; border-radius: 9px;
    background: color-mix(in srgb, var(--accent) 13%, transparent);
    font: 500 11px/1 "JetBrains Mono", monospace; color: var(--accent);
  }
  .mark svg {
    fill: none; stroke: var(--accent); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
  }

  /* Research interests */
  .interests { gap: 22px; width: 880px; min-height: 96px; padding: 14px 20px 14px 32px; border-radius: 15px; }
  .interests strong { flex: none; font: 400 27px/1 "Instrument Serif", serif; color: var(--text); }
  .interests ul { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; }
  .interests li {
    padding: 8px 13px; border-radius: 999px;
    background: color-mix(in srgb, var(--tone) 10%, #fff);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tone) 26%, #fff);
    font: 500 13.5px/1 Inter, sans-serif; color: #1f2937; white-space: nowrap;
  }

  /* Profile links */
  .link { gap: 10px; height: 46px; padding: 0 16px 0 10px; }
  .link .mark { width: 28px; height: 28px; }
  .link .mark svg { width: 18px; height: 18px; }
  .link strong { font: 600 14px/1 Inter, sans-serif; color: var(--text); white-space: nowrap; }
  .link small { font: 400 11px/1 "JetBrains Mono", monospace; color: var(--faint); white-space: nowrap; }
  .link .go { margin-left: auto; font: 500 16px/1 Inter, sans-serif; color: var(--accent); }
</style>
</head>
<body>
<script id="profile" type="application/json">/*PROFILE*/</script>
<main id="stage"></main>

<script>
  const profile = JSON.parse(document.getElementById('profile').textContent);
  const stage = document.getElementById('stage');
  const NS = 'http://www.w3.org/2000/svg';
  const TONES = ['amber', 'teal', 'coral', 'lilac'];

  const make = (tag, className, text) => {
    const el = document.createElement(tag);
    if (className) el.className = className;
    if (text !== undefined) el.textContent = text;
    return el;
  };
  const section = (id) => {
    const el = make('section');
    el.id = id;
    stage.appendChild(el);
    return el;
  };

  // Hero
  const hero = make('div', 'hero');
  hero.appendChild(make('div', 'grid'));
  const orbits = document.createElementNS(NS, 'svg');
  orbits.id = 'orbits';
  orbits.setAttribute('viewBox', '0 0 880 176');
  hero.appendChild(orbits);
  const copy = make('div', 'copy');
  copy.appendChild(make('p', 'hello', profile.greeting));
  copy.appendChild(make('h1', '', profile.name));
  profile.roles.filter(Boolean).forEach((role) => copy.appendChild(make('p', 'role', role)));
  hero.appendChild(copy);
  section('hero').appendChild(hero);

  // Research interests
  const strip = make('div', 'strip interests');
  strip.style.setProperty('--accent', 'var(--lilac)');
  const label = make('strong');
  label.append('Research', document.createElement('br'), 'interests');
  strip.appendChild(label);
  const list = make('ul');
  profile.interests.forEach((interest, index) => {
    const item = make('li', '', interest);
    item.style.setProperty('--tone', `var(--${TONES[index % TONES.length]})`);
    list.appendChild(item);
  });
  strip.appendChild(list);
  section('interests').appendChild(strip);

  // Profile links
  profile.links.forEach((link, index) => {
    const row = make('div', 'strip link');
    row.style.setProperty('--accent', `var(--${TONES[index % TONES.length]})`);
    const mark = make('span', 'mark');
    if (link.mark === 'cap') {
      const cap = document.createElementNS(NS, 'svg');
      cap.setAttribute('viewBox', '0 0 34 34');
      ['M2 13L17 6l15 7-15 7z', 'M8 16.500V24c4 4 14 4 18 0v-7.500', 'M32 13v8'].forEach((d) => {
        const path = document.createElementNS(NS, 'path');
        path.setAttribute('d', d);
        cap.appendChild(path);
      });
      mark.appendChild(cap);
    } else {
      mark.textContent = link.mark;
    }
    row.append(mark, make('strong', '', link.label), make('small', '', link.note), make('span', 'go', '↗'));
    section(`link-${index + 1}`).appendChild(row);
  });

  // Orbit motif: an aggregator with clients on rings. Fixed values, so every render matches.
  const centre = { x: 736, y: 88 };
  const colours = { amber: '#e0902f', coral: '#e2664b', teal: '#16a394', lilac: '#7c6be0', white: '#94a1b5' };
  const rings = [44, 80, 122, 176];
  const nodes = [
    [0, 205, 'amber', 2.6], [0, 60, 'white', 2],
    [1, 318, 'teal', 3.2], [1, 140, 'lilac', 2.8], [1, 56, 'coral', 2.4],
    [2, 16, 'coral', 3.6], [2, 340, 'white', 2], [2, 198, 'amber', 2.8], [2, 160, 'teal', 2.6],
    [3, 188, 'lilac', 2.8],
  ];
  const add = (name, attrs) => {
    const el = document.createElementNS(NS, name);
    Object.entries(attrs).forEach(([key, value]) => el.setAttribute(key, value));
    orbits.appendChild(el);
  };
  const point = (radius, degrees) => {
    const angle = degrees * Math.PI / 180;
    return { x: centre.x + radius * Math.cos(angle), y: centre.y + radius * Math.sin(angle) };
  };
  rings.forEach((radius, index) => add('circle', {
    cx: centre.x, cy: centre.y, r: radius, fill: 'none',
    stroke: 'rgba(40,55,85,.2)', 'stroke-width': 1,
    'stroke-dasharray': index % 2 ? '2 6' : 'none',
  }));
  nodes.forEach(([ring, degrees, colour]) => {
    const end = point(rings[ring], degrees);
    add('line', { x1: centre.x, y1: centre.y, x2: end.x, y2: end.y, stroke: colours[colour], 'stroke-opacity': .38, 'stroke-width': 1 });
  });
  nodes.forEach(([ring, degrees, colour, size]) => {
    const spot = point(rings[ring], degrees);
    add('circle', { cx: spot.x, cy: spot.y, r: size * 3, fill: colours[colour], opacity: .16 });
    add('circle', { cx: spot.x, cy: spot.y, r: size, fill: colours[colour] });
  });
  add('circle', { cx: centre.x, cy: centre.y, r: 20, fill: '#e0902f', opacity: .13 });
  add('circle', { cx: centre.x, cy: centre.y, r: 11, fill: '#e0902f', opacity: .24 });
  add('circle', { cx: centre.x, cy: centre.y, r: 5, fill: '#e0902f' });

  // Show one section, or all of them while measuring.
  const wanted = location.hash.slice(1);
  document.querySelectorAll('section').forEach((el) => {
    if (!wanted || el.id === wanted) el.classList.add('shown');
  });
  document.fonts.ready.then(() => {
    document.title = JSON.stringify({
      height: strip.offsetHeight,
      overflow: strip.scrollWidth > strip.clientWidth,
      fonts: document.fonts.check('52px "Instrument Serif"') && document.fonts.check('600 14px Inter'),
    });
  });
</script>
</body>
</html>
